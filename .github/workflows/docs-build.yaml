name: Docs (release build)
on:
  workflow_dispatch:
  push:
    branches: [stable]
    paths:
      - "docs/**"
      - "CHANGELOG*.md"
      - "package.json"
      - ".github/fork-release.json"
      - ".github/scripts/fork-release.cjs"
      - ".github/workflows/docs-build.yaml"

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Preview root and archived docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: node .github/scripts/fork-release.cjs docs "$RUNNER_TEMP/docs"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ${{ runner.temp }}/docs
          if-no-files-found: error
      # Docs corrections wait for the next upstream version. Never clobber old assets.
