name: Docs (check)

on:
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app/tokens.css"
      - ".github/workflows/docs-*.yaml"
  workflow_dispatch:

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Check documentation types
        working-directory: docs
        run: |
          node ../node_modules/@react-router/dev/bin.cjs typegen
          node ../node_modules/typescript/bin/tsc -p tsconfig.json

      - name: Build archived docs
        run: pnpm docs:build
        env:
          HEADPLANE_DOCS_BASE: /0.8/
          HEADPLANE_DOCS_CHANNEL: archived
          HEADPLANE_DOCS_VERSION: "0.8"
