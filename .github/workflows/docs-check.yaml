name: Docs (0.8 check)

on:
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs-*.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-08-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: VitePress root and archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: node node_modules/typescript/bin/tsc -p docs/tsconfig.json
      - run: pnpm exec vitepress build docs --base /0.8/
