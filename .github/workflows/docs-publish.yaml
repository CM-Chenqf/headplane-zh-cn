name: Docs (publish)
on:
  # The community release workflow dispatches this after immutable publication.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Upload the assembled site without deploying
        type: boolean
        default: false

concurrency:
  group: docs-publish
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  publish:
    name: Publish versioned community docs
    if: github.repository == 'CM-Chenqf/headplane-zh-cn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Verify release manifests and assemble newest release of each minor
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/docs-site.cjs site
      - name: Upload assembled documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          include-hidden-files: true
          if-no-files-found: error
      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.dry-run && vars.CF_PAGES_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT || 'headplane-zh-cn-docs' }} --branch=main
