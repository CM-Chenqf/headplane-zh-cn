name: Release (recover uploaded images)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing, unchanged community tag (vX.Y.Z-zh)
        type: string
        required: true
      original_run:
        description: Original failed Release run with successful image uploads
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: community-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'CM-Chenqf/headplane-zh-cn'
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.guard.outputs.image }}
      tag: ${{ steps.guard.outputs.tag }}
      minor: ${{ steps.guard.outputs.minor }}
      latest: ${{ steps.guard.outputs.latest }}
      minor_latest: ${{ steps.guard.outputs.minor_latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: release-tools
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/package.json
      - name: Validate original build provenance and unchanged accepted source
        id: guard
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          TAG: ${{ inputs.tag }}
        run: node ../release-tools/.github/scripts/recover-release.cjs "$ORIGINAL_RUN" "$TAG"

  verify:
    needs: prepare
    name: Verify existing image (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: [final, debug-shell]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          path: release-tools
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/package.json
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: release-digests
          run-id: ${{ inputs.original_run }}
          github-token: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Require the original digest and both original platforms
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          SUFFIX=""; [[ "$TARGET" == final ]] || SUFFIX="-shell"
          DIGEST=$(jq -er --arg target "$TARGET" 'select(.target == $target) | .digest | select(test("^sha256:[a-f0-9]{64}$"))' "release-digests/$TARGET.json")
          docker buildx imagetools inspect "$IMAGE:$TAG$SUFFIX" --format '{{json .Manifest}}' > "$RUNNER_TEMP/index.json"
          test "$(jq -r .digest "$RUNNER_TEMP/index.json")" = "$DIGEST"
          for ARCH in amd64 arm64; do
            jq -e --arg arch "$ARCH" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)' "$RUNNER_TEMP/index.json" > /dev/null
          done
          docker pull --platform "$PLATFORM" "$IMAGE@$DIGEST"
          echo "SMOKE_IMAGE=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
          echo "SMOKE_PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
      - name: Validate real Headscale, health and both interface languages
        working-directory: source
        run: node ../release-tools/.github/scripts/container-smoke.mjs

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: source
      - uses: actions/setup-node@v6
        with:
          node-version-file: source/package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-input
          path: release-assets
          run-id: ${{ inputs.original_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: release-digests
          run-id: ${{ inputs.original_run }}
          github-token: ${{ github.token }}
      - name: Bundle unchanged tag source with original documentation and digests
        working-directory: source
        run: node .github/scripts/fork-release.cjs bundle ../release-assets ../release-digests
      - name: Publish and lock the complete draft
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: node .github/scripts/fork-release.cjs publish ../release-assets "$LATEST"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move only latest and minor aliases to the published original digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          MINOR: ${{ needs.prepare.outputs.minor }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          MINOR_LATEST: ${{ needs.prepare.outputs.minor_latest }}
        run: |
          set -euo pipefail
          for TARGET in final debug-shell; do
            SUFFIX=""; [[ "$TARGET" == final ]] || SUFFIX="-shell"
            DIGEST=$(jq -r .digest "release-digests/$TARGET.json")
            TAGS=()
            [[ "$MINOR_LATEST" != true ]] || TAGS+=(--tag "$IMAGE:$MINOR$SUFFIX")
            [[ "$LATEST" != true ]] || TAGS+=(--tag "$IMAGE:latest$SUFFIX")
            if ((${#TAGS[@]})); then
              docker buildx imagetools create "${TAGS[@]}" "$IMAGE@$DIGEST"
            fi
          done
