name: Docs
on:
  pull_request:
  push:
    branches: [main, stable]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Bilingual root and archive previews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: node .github/scripts/fork-release.cjs docs "$RUNNER_TEMP/docs"
      - name: Check documentation types
        run: node node_modules/typescript/bin/tsc -p docs/tsconfig.json
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-docs-preview
          path: ${{ runner.temp }}/docs
          retention-days: 7
          if-no-files-found: error
