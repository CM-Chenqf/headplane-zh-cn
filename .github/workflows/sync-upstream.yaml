name: Upstream sync

on:
  push:
    branches: [main, stable]
    paths: [package.json, pnpm-lock.yaml]
  schedule:
    # 09:27 Asia/Shanghai. GitHub schedules may run later when runners are busy.
    - cron: "27 1 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: github.repository == 'laity-cqf/headplane-zh-cn' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the maintained branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Open upstream pull requests and translation reminders
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          script: |
            const sync = require('./.github/scripts/sync-upstream.cjs');
            await sync({ github, context, core });

  nix-pnpm-hash:
    name: Update Nix PNPM Hash
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Compute correct PNPM dependencies hash
        run: |
          CURRENT_HASH=$(grep -oP "hash = \"\K[^\"]*" nix/package.nix)
          sed -i "s|hash = \"$CURRENT_HASH\"|hash = \"\"|" nix/package.nix

          # A fixed-output hash mismatch is expected here; other errors must fail.
          if nix build .#headplane.pnpmDeps --no-link > "$RUNNER_TEMP/nix-hash.log" 2>&1; then
            git restore nix/package.nix
            exit 0
          fi
          NEW_HASH=$(awk '/got:/ {print $2}' "$RUNNER_TEMP/nix-hash.log")
          if [[ ! "$NEW_HASH" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            git restore nix/package.nix
            cat "$RUNNER_TEMP/nix-hash.log"
            exit 1
          fi
          sed -i "s|hash = \"\"|hash = \"$NEW_HASH\"|" nix/package.nix

      - name: Commit and push
        run: |
          if git diff --quiet nix/package.nix; then
            echo "Hash is already up to date, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix
          git commit -m "chore: update nix pnpm deps hash"
          git push
